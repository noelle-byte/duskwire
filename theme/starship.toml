# ============================================================
# Starship prompt — cozy violet twilight
# ============================================================

add_newline = true
command_timeout = 1000
palette = "twilight"

format = """
[╭─](lavender)$username $directory$git_branch$git_status$python$nodejs$rust$cmd_duration
[╰─](lavender)$character
"""

right_format = "$status"


# ------------------------------------------------------------
# Identity
# ------------------------------------------------------------

[username]
show_always = true
style_user = "amber bold"
style_root = "pink bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "periwinkle"
format = "[@$hostname]($style) "


# ------------------------------------------------------------
# Location
# ------------------------------------------------------------

[directory]
style = "cream bold"
read_only = " 󰌾"
read_only_style = "pink"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "


# ------------------------------------------------------------
# Git
# ------------------------------------------------------------

[git_branch]
symbol = " "
style = "lavender"
format = "[$symbol$branch]($style) "

[git_status]
style = "pink"
format = "[$all_status$ahead_behind]($style) "

conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " stash"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"


# ------------------------------------------------------------
# Languages and project markers
# ------------------------------------------------------------

[python]
symbol = "py "
style = "periwinkle"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "orchid"
format = "[$symbol$version]($style) "

[rust]
symbol = "rs "
style = "pink"
format = "[$symbol$version]($style) "


# ------------------------------------------------------------
# Command information
# ------------------------------------------------------------

[cmd_duration]
min_time = 1000
style = "muted"
format = "[took $duration]($style) "

[status]
disabled = false
style = "pink bold"
format = "[$symbol$status]($style)"
symbol = "ERR "


# ------------------------------------------------------------
# Prompt character
# ------------------------------------------------------------

[character]
success_symbol = "[❯](amber)"
error_symbol = "[❯](pink)"
vimcmd_symbol = "[❮](orchid)"
